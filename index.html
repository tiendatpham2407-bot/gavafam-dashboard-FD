<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gavafam E-commerce Financial Dashboard (Sep 15 - Nov 07, 2026)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#3b82f6',
                    }
                }
            }
        }
    </script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-slate-100 font-sans antialiased min-h-screen">

    <!-- Header & Live Exchange Rate Controls -->
    <header class="bg-cardbg border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-chart-line text-accent"></i> Gavafam P&L Command Center
                </h1>
                <p class="text-xs text-slate-400">Giai đoạn chuẩn: 15/09/2026 – 07/11/2026 | Dữ liệu thực tế từ Shopify, Ads (FB/GG), Fulfill (EUR) & API</p>
            </div>
            
            <!-- Live Exchange Rate & Fixed Cost Inputs -->
            <div class="flex flex-wrap items-center gap-3 bg-slate-900/60 p-2 rounded-xl border border-slate-700 text-xs">
                <div>
                    <label class="block text-slate-400 mb-1">Tỷ giá SEK/USD:</label>
                    <input type="number" id="fxSEK" value="0.095" step="0.001" class="bg-slate-800 text-white px-2 py-1 rounded w-20 text-center border border-slate-600 focus:outline-none focus:border-accent" onchange="updateDashboard()">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Tỷ giá EUR/USD:</label>
                    <input type="number" id="fxEUR" value="1.08" step="0.01" class="bg-slate-800 text-white px-2 py-1 rounded w-20 text-center border border-slate-600 focus:outline-none focus:border-accent" onchange="updateDashboard()">
                </div>
                <div>
                    <label class="block text-slate-400 mb-1">Fixed Cost (% Rev):</label>
                    <input type="number" id="fixedCostPct" value="10" step="1" class="bg-slate-800 text-white px-2 py-1 rounded w-16 text-center border border-slate-600 focus:outline-none focus:border-accent" onchange="updateDashboard()">
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Filters Bar -->
        <section class="bg-cardbg p-4 rounded-2xl border border-slate-800 shadow-lg grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1"><i class="fa-solid fa-calendar mr-1"></i> Khoảng thời gian</label>
                <select id="filterDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent" onchange="updateDashboard()">
                    <option value="all">Toàn kỳ (15/09 - 07/11)</option>
                    <option value="sep">Tháng 9 (15/09 - 30/09)</option>
                    <option value="oct">Tháng 10 (01/10 - 31/10)</option>
                    <option value="nov">Tháng 11 (01/11 - 07/11)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1"><i class="fa-solid fa-globe mr-1"></i> Quốc gia</label>
                <select id="filterCountry" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent" onchange="updateDashboard()">
                    <option value="all">Tất cả Quốc Gia</option>
                    <option value="Sweden">Sweden (SE)</option>
                    <option value="Norway">Norway (NO)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1"><i class="fa-solid fa-box mr-1"></i> Sản phẩm / SKU</label>
                <select id="filterProduct" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-accent" onchange="updateDashboard()">
                    <option value="all">Tất cả Sản phẩm</option>
                    <option value="I17PBWTD8AI">I17PBWTD8AI (I Am Your Father - Star war AI)</option>
                    <option value="I08F736D160">I08F736D160 (Pokémon Card - Card Pokemon)</option>
                </select
